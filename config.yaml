# Configuration of generators (defaults illustrated)
---
# The directory where the generated files are stored
# directory: "tmp"

# By default all generators are run. Specify here the ones to skip.
excludes:
  - markdown

# Alternatively only specify the generators to run
# (comment out the above "excludes" section)
# includes:
#   - markdown
#   - excel

# Set the arguments for the generators (no matter if they run or not)
generator_args:
  excel:
    mergeimports: true
  owl:
    mergeimports: true
    metaclasses: false
    type_objects: false
    add_root_classes: true
    mixins_as_expressions: true
    # Emit class IRIs based on class_uri (e.g. dcat:Catalog) rather than
    # the schema's default-prefix native IRI (dcat_ap:Catalogue). This
    # matches the upstream DCAT-AP ontology's class identifiers.
    use_native_uris: false
  markdown:
    mergeimports: true
    directory: "docs/elements"
  graphql:
    mergeimports: true
  # gen-java is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # java:
  #   mergeimports: true
  #   metadata: true
  jsonld:
    mergeimports: true
  jsonschema:
    mergeimports: true
  jsonldcontext:
    mergeimports: true
  # gen-pydantic is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # pydantic:
  #   mergeimports: true
  python:
    mergeimports: true
    # head: true  # Why does this not work?
  prefixmap:
    mergeimports: true
  proto:
    mergeimports: true
  shacl:
    mergeimports: true
    # Match SEMIC DCAT-AP semantics: open shapes (no sh:closed true).
    # Mixin/abstract classes already get sh:closed false; this flag
    # turns it off uniformly. See COMPARISON.md.
    closed: false
    # Append 'Shape' to class_uri-derived shape IRIs to match the
    # upstream convention (e.g. dcat:Catalog -> dcat:CatalogShape).
    # Available since linkml main (gen-shacl --suffix).
    suffix: Shape
  shex:
    mergeimports: true
  sqlddl:
    mergeimports: true
  typescript:
    mergeimports: true
    metadata: true

...
