name: dcat_ap
description: A LinkML approximation of the SEMIC DCAT-AP 3.0.1 specification. This
  schema captures the core classes and properties of DCAT-AP 3.0.1 as defined by the
  SHACL shapes at https://semiceu.github.io/DCAT-AP/releases/3.0.1/html/shacl/shapes.ttl
  and the JSON-LD context at https://semiceu.github.io/DCAT-AP/releases/3.0.1/context/dcat-ap.jsonld
  This is a SCOPING/DEMO schema, not a production specification. Some constructs (e.g.
  property-level disjunction shapes, sh:or with multiple datatypes, inverse paths)
  are not directly expressible in LinkML and are approximated or omitted.
title: DCAT-AP 3.0.1 (LinkML approximation)
id: https://w3id.org/semic/dcat-ap/3.0.1
imports:
- linkml:types
license: CC-BY-4.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  dcat_ap:
    prefix_prefix: dcat_ap
    prefix_reference: https://w3id.org/semic/dcat-ap/
  dcat:
    prefix_prefix: dcat
    prefix_reference: http://www.w3.org/ns/dcat#
  dcatap:
    prefix_prefix: dcatap
    prefix_reference: http://data.europa.eu/r5r/
  dct:
    prefix_prefix: dct
    prefix_reference: http://purl.org/dc/terms/
  foaf:
    prefix_prefix: foaf
    prefix_reference: http://xmlns.com/foaf/0.1/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  adms:
    prefix_prefix: adms
    prefix_reference: http://www.w3.org/ns/adms#
  spdx:
    prefix_prefix: spdx
    prefix_reference: http://spdx.org/rdf/terms#
  prov:
    prefix_prefix: prov
    prefix_reference: http://www.w3.org/ns/prov#
  odrl:
    prefix_prefix: odrl
    prefix_reference: http://www.w3.org/ns/odrl/2/
  locn:
    prefix_prefix: locn
    prefix_reference: http://www.w3.org/ns/locn#
  time:
    prefix_prefix: time
    prefix_reference: http://www.w3.org/2006/time#
  vcard:
    prefix_prefix: vcard
    prefix_reference: http://www.w3.org/2006/vcard/ns#
  eli:
    prefix_prefix: eli
    prefix_reference: http://data.europa.eu/eli/ontology#
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  owl:
    prefix_prefix: owl
    prefix_reference: http://www.w3.org/2002/07/owl#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: dcat_ap
default_range: string
types:
  hexBinary:
    name: hexBinary
    definition_uri: https://w3id.org/semic/dcat-ap/HexBinary
    description: A hex-binary encoded value.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    base: str
    uri: xsd:hexBinary
  duration:
    name: duration
    definition_uri: https://w3id.org/semic/dcat-ap/Duration
    description: An XSD duration literal.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    base: str
    uri: xsd:duration
  nonNegativeInteger:
    name: nonNegativeInteger
    definition_uri: https://w3id.org/semic/dcat-ap/NonNegativeInteger
    description: An XSD non-negative integer.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    base: int
    uri: xsd:nonNegativeInteger
    minimum_value: 0
  gYear:
    name: gYear
    definition_uri: https://w3id.org/semic/dcat-ap/GYear
    description: An XSD gYear literal (a Gregorian calendar year, e.g. "2024"). Used
      in DCAT-AP's DateOrDateTimeDataType disjunction.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    base: str
    uri: xsd:gYear
  gYearMonth:
    name: gYearMonth
    definition_uri: https://w3id.org/semic/dcat-ap/GYearMonth
    description: An XSD gYearMonth literal (a Gregorian calendar year and month, e.g.
      "2024-04"). Used in DCAT-AP's DateOrDateTimeDataType disjunction.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    base: str
    uri: xsd:gYearMonth
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
slots:
  title:
    name: title
    definition_uri: https://w3id.org/semic/dcat-ap/title
    description: A name given to the resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:title
    slot_uri: dct:title
    owner: Distribution
    domain_of:
    - Catalogue
    - CatalogueRecord
    - ConceptScheme
    - DataService
    - Dataset
    - DatasetSeries
    - Distribution
    range: string
    multivalued: true
  description:
    name: description
    definition_uri: https://w3id.org/semic/dcat-ap/description
    description: A free-text account of the resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:description
    slot_uri: dct:description
    owner: Distribution
    domain_of:
    - Catalogue
    - CatalogueRecord
    - DataService
    - Dataset
    - DatasetSeries
    - Distribution
    range: string
    multivalued: true
  identifier:
    name: identifier
    definition_uri: https://w3id.org/semic/dcat-ap/identifier
    description: A unique identifier of the resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:identifier
    slot_uri: dct:identifier
    owner: Dataset
    domain_of:
    - Dataset
    range: string
    multivalued: true
  keyword:
    name: keyword
    definition_uri: https://w3id.org/semic/dcat-ap/keyword
    description: A keyword or tag describing the resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:keyword
    slot_uri: dcat:keyword
    owner: Dataset
    domain_of:
    - DataService
    - Dataset
    range: string
    multivalued: true
  notation:
    name: notation
    definition_uri: https://w3id.org/semic/dcat-ap/notation
    description: A string used to identify a concept within a scheme.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - skos:notation
    slot_uri: skos:notation
    owner: Identifier
    domain_of:
    - Identifier
    range: string
  preferredLabel:
    name: preferredLabel
    definition_uri: https://w3id.org/semic/dcat-ap/preferredLabel
    description: The preferred lexical label for a resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - skos:prefLabel
    slot_uri: skos:prefLabel
    owner: Concept
    domain_of:
    - Concept
    range: string
    multivalued: true
  name:
    name: name
    definition_uri: https://w3id.org/semic/dcat-ap/name
    description: A name for an agent.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - foaf:name
    slot_uri: foaf:name
    owner: Agent
    domain_of:
    - Agent
    range: string
    multivalued: true
  version:
    name: version
    definition_uri: https://w3id.org/semic/dcat-ap/version
    description: The version indicator of a resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:version
    slot_uri: dcat:version
    owner: Dataset
    domain_of:
    - Dataset
    range: string
  versionNotes:
    name: versionNotes
    definition_uri: https://w3id.org/semic/dcat-ap/versionNotes
    description: A description of changes between versions.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - adms:versionNotes
    slot_uri: adms:versionNotes
    owner: Dataset
    domain_of:
    - Dataset
    range: string
    multivalued: true
  bbox:
    name: bbox
    definition_uri: https://w3id.org/semic/dcat-ap/bbox
    description: The geographic bounding box of a resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:bbox
    slot_uri: dcat:bbox
    owner: Location
    domain_of:
    - Location
    range: string
  centroid:
    name: centroid
    definition_uri: https://w3id.org/semic/dcat-ap/centroid
    description: The geographic centroid of a resource.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:centroid
    slot_uri: dcat:centroid
    owner: Location
    domain_of:
    - Location
    range: string
  startDate:
    name: startDate
    definition_uri: https://w3id.org/semic/dcat-ap/startDate
    description: The start of the period. Modelled as a DateOrDateTimeDataType disjunction
      (xsd:date | xsd:dateTime | xsd:gYear | xsd:gYearMonth) to match DCAT-AP's DateOrDateTimeDataType_Shape.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:startDate
    slot_uri: dcat:startDate
    owner: PeriodOfTime
    domain_of:
    - PeriodOfTime
    range: string
    any_of:
    - range: date
    - range: datetime
    - range: gYear
    - range: gYearMonth
  endDate:
    name: endDate
    definition_uri: https://w3id.org/semic/dcat-ap/endDate
    description: The end of the period. Modelled as a DateOrDateTimeDataType disjunction
      (xsd:date | xsd:dateTime | xsd:gYear | xsd:gYearMonth) to match DCAT-AP's DateOrDateTimeDataType_Shape.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:endDate
    slot_uri: dcat:endDate
    owner: PeriodOfTime
    domain_of:
    - PeriodOfTime
    range: string
    any_of:
    - range: date
    - range: datetime
    - range: gYear
    - range: gYearMonth
  releaseDate:
    name: releaseDate
    definition_uri: https://w3id.org/semic/dcat-ap/releaseDate
    description: The date of formal issuance of the resource. Modelled as a DateOrDateTimeDataType
      disjunction (xsd:date | xsd:dateTime | xsd:gYear | xsd:gYearMonth) to match
      DCAT-AP's DateOrDateTimeDataType_Shape.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:issued
    slot_uri: dct:issued
    owner: Distribution
    domain_of:
    - Catalogue
    - Dataset
    - DatasetSeries
    - Distribution
    range: string
    any_of:
    - range: date
    - range: datetime
    - range: gYear
    - range: gYearMonth
  modificationDate:
    name: modificationDate
    definition_uri: https://w3id.org/semic/dcat-ap/modificationDate
    description: The date on which the resource was changed. Modelled as a DateOrDateTimeDataType
      disjunction (xsd:date | xsd:dateTime | xsd:gYear | xsd:gYearMonth) to match
      DCAT-AP's DateOrDateTimeDataType_Shape.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:modified
    slot_uri: dct:modified
    owner: Distribution
    domain_of:
    - Catalogue
    - CatalogueRecord
    - Dataset
    - DatasetSeries
    - Distribution
    range: string
    any_of:
    - range: date
    - range: datetime
    - range: gYear
    - range: gYearMonth
  listingDate:
    name: listingDate
    definition_uri: https://w3id.org/semic/dcat-ap/listingDate
    description: The date on which the description was listed in the catalogue. Modelled
      as a DateOrDateTimeDataType disjunction (xsd:date | xsd:dateTime | xsd:gYear
      | xsd:gYearMonth) to match DCAT-AP's DateOrDateTimeDataType_Shape.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:issued
    slot_uri: dct:issued
    owner: CatalogueRecord
    domain_of:
    - CatalogueRecord
    range: string
    any_of:
    - range: date
    - range: datetime
    - range: gYear
    - range: gYearMonth
  byteSize:
    name: byteSize
    definition_uri: https://w3id.org/semic/dcat-ap/byteSize
    description: The size of a distribution in bytes.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:byteSize
    slot_uri: dcat:byteSize
    owner: Distribution
    domain_of:
    - Distribution
    range: integer
  spatialResolution:
    name: spatialResolution
    definition_uri: https://w3id.org/semic/dcat-ap/spatialResolution
    description: Minimum spatial separation resolvable, in meters.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:spatialResolutionInMeters
    slot_uri: dcat:spatialResolutionInMeters
    owner: Distribution
    domain_of:
    - Dataset
    - Distribution
    range: decimal
    multivalued: true
  temporalResolution:
    name: temporalResolution
    definition_uri: https://w3id.org/semic/dcat-ap/temporalResolution
    description: Minimum time period resolvable in the dataset.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dcat:temporalResolution
    slot_uri: dcat:temporalResolution
    owner: Distribution
    domain_of:
    - Dataset
    - Distribution
    range: string
  checksumValue:
    name: checksumValue
    definition_uri: https://w3id.org/semic/dcat-ap/checksumValue
    description: A lower-case hexadecimal-encoded checksum value.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - spdx:checksumValue
    slot_uri: spdx:checksumValue
    owner: Checksum
    domain_of:
    - Checksum
    range: string
  publisher:
    name: publisher
    definition_uri: https://w3id.org/semic/dcat-ap/publisher
    description: An entity responsible for making the resource available.
    from_schema: https://w3id.org/semic/dcat-ap/3.0.1
    mappings:
    - dct:publisher
    slot_uri: dct:publisher
    owner: DatasetSeries
    domain_of:
    - Catalogue
    - DataService
    - Dataset
    - DatasetSeries
    range: Agent
    inlined: true
